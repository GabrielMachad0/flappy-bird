<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird+</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pipe: #2EC4B6;
    --pipe-dark: #1A9388;
    --bird: #FFD93D;
    --bird-dark: #E8A800;
    --ground: #DEB887;
    --ground-dark: #C19A6B;
    --ink: #1A535C;
    --glass: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a2a3a 0%, #0d1117 100%);
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 800px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    border-radius: 0;
  }
  @media (min-width: 481px) and (min-height: 801px) {
    #stage { border-radius: 20px; }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .btn-flap {
    background: linear-gradient(135deg, #FFD93D, #FFA500);
    color: #1A535C;
    border: none;
    padding: 14px 36px;
    border-radius: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 0 #C97F00, 0 8px 24px rgba(255,165,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn-flap:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #C97F00, 0 4px 12px rgba(255,165,0,0.3);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 24px;
    border-radius: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .btn-ghost:active { background: rgba(255,255,255,0.2); }
  .btn-ghost.active { background: rgba(255,217,61,0.25); border-color: #FFD93D; color: #FFD93D; }
  .score-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 56px;
    color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    line-height: 1;
  }
  .label-small {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .title-big {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    color: #FFD93D;
    text-shadow: 3px 3px 0 #C97F00, 0 0 40px rgba(255,217,61,0.3);
    line-height: 1.4;
  }
  .medal {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .medal-gold { background: linear-gradient(135deg, #FFD700, #B8860B); }
  .medal-silver { background: linear-gradient(135deg, #C0C0C0, #808080); }
  .medal-bronze { background: linear-gradient(135deg, #CD7F32, #8B4513); }
  .medal-platinum { background: linear-gradient(135deg, #E5E4E2, #A9A9A9); }
  .medal-none { background: linear-gradient(135deg, #555, #333); }
  .blink { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .float-in { animation: floatIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes floatIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .hud-score {
    position: absolute;
    top: 40px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 48px;
    color: #fff;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    z-index: 5;
    pointer-events: none;
    transition: transform 0.15s;
  }
  .hud-score.pop { transform: translateX(-50%) scale(1.3); }
  .hud-combo {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #FFD93D;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hud-combo.show { opacity: 1; }
  .hud-btn {
    position: absolute;
    top: 16px;
    z-index: 6;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 18px;
  }
  .hud-pause { right: 16px; }
  .hud-sound { right: 64px; }
  .hud-powerup {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 6;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .powerup-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 2px solid;
    transition: opacity 0.3s;
  }
  .powerup-icon.inactive { opacity: 0.2; }
  .powerup-shield { background: rgba(0,191,255,0.2); border-color: rgba(0,191,255,0.6); }
  .powerup-slow { background: rgba(186,85,211,0.2); border-color: rgba(186,85,211,0.6); }
  .powerup-timer {
    position: absolute;
    bottom: -3px; left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    text-shadow: 1px 1px 0 #000;
  }
  .skin-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .skin-btn:hover { transform: scale(1.1); }
  .skin-btn.active { border-color: #FFD93D; transform: scale(1.15); }
  .ach-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,217,61,0.15);
    border: 1px solid rgba(255,217,61,0.4);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 10px;
    font-family: 'Press Start 2P', monospace;
    color: #FFD93D;
  }
  .ach-badge.locked {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }
  .diff-btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.6);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .diff-btn.active {
    border-color: #FFD93D;
    background: rgba(255,217,61,0.15);
    color: #FFD93D;
  }
  .scroll-y { overflow-y: auto; max-height: 60vh; }
  .scroll-y::-webkit-scrollbar { width: 4px; }
  .scroll-y::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .lb-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-radius: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }
  .lb-row:nth-child(1) { background: rgba(255,215,0,0.15); }
  .lb-row:nth-child(2) { background: rgba(192,192,192,0.1); }
  .lb-row:nth-child(3) { background: rgba(205,127,50,0.1); }
  .lb-rank { color: rgba(255,255,255,0.5); width: 24px; text-align: left; }
  .lb-score { color: #FFD93D; }
  .lb-diff { color: rgba(255,255,255,0.4); font-size: 8px; }

  /* ===== Weather / Climate ===== */
  .weather-indicator {
    position: absolute;
    top: 60px; left: 16px;
    z-index: 6;
    font-size: 22px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 4px 8px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: opacity 0.5s;
    pointer-events: none;
  }
  .weather-indicator.hidden { opacity: 0; }

  /* ===== Zen Mode ===== */
  .zen-hud {
    position: absolute;
    bottom: 130px; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .zen-hud.show { opacity: 1; }
  .zen-hud .big { font-size: 28px; color: #FFD93D; display: block; margin-bottom: 4px; }
  .zen-item {
    position: absolute;
    pointer-events: none;
    transition: none;
  }

  /* ===== Shop ===== */
  .shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
  }
  .shop-item.owned { border-color: rgba(255,217,61,0.3); background: rgba(255,217,61,0.08); }
  .shop-btn {
    background: linear-gradient(135deg, #FFD93D, #FFA500);
    color: #1A535C;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    box-shadow: 0 3px 0 #C97F00;
    transition: transform 0.1s;
  }
  .shop-btn:active { transform: translateY(2px); }
  .shop-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
  .shop-btn.owned-btn { background: rgba(255,255,255,0.1); color: #4CAF50; box-shadow: none; border: 1px solid #4CAF50; }
  .coin-icon { color: #FFD93D; font-size: 14px; }

  /* ===== Missions ===== */
  .mission-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    width: 100%;
  }
  .mission-card.completed {
    border-color: #4CAF50;
    background: rgba(76,175,80,0.1);
  }
  .mission-progress {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    margin-top: 6px;
    overflow: hidden;
  }
  .mission-progress-bar {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #FFD93D, #FFA500);
    transition: width 0.3s;
  }
  .mission-reward {
    color: #FFD93D;
    font-size: 9px;
  }

  /* ===== Coin HUD ===== */
  .coin-hud {
    position: absolute;
    top: 16px; left: 64px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 6px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #FFD93D;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .coin-hud.hidden { opacity: 0; }

  /* ===== Tab buttons ===== */
  .tab-row {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active {
    border-color: #FFD93D;
    background: rgba(255,217,61,0.15);
    color: #FFD93D;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- HUD score during play -->
    <div id="hudScore" class="hud-score hidden">0</div>
    <div id="hudCombo" class="hud-combo">COMBO x2</div>
    <div id="hudPause" class="hud-btn hud-pause hidden">⏸</div>
    <div id="hudSound" class="hud-btn hud-sound hidden">🔊</div>

    <!-- Power-up indicators -->
    <div id="hudPowerups" class="hud-powerup hidden">
      <div id="puShield" class="powerup-icon powerup-shield inactive">
        🛡️
        <span class="powerup-timer" id="puShieldTimer"></span>
      </div>
      <div id="puSlow" class="powerup-icon powerup-slow inactive">
        ⏳
        <span class="powerup-timer" id="puSlowTimer"></span>
      </div>
    </div>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <div class="float-in flex flex-col items-center gap-4">
        <h1 class="title-big">FLAPPY<br>BIRD+</h1>
        <div class="glass-card">
          <p class="text-white/80 text-sm mb-3">Toque na tela ou pressione<br><span class="pixel text-xs">ESPAÇO</span> para voar</p>

          <!-- Skins -->
          <div class="mb-3">
            <div class="label-small mb-2">SKIN</div>
            <div id="skinRow" class="flex items-center justify-center gap-3"></div>
          </div>

          <!-- Difficulty -->
          <div class="mb-3">
            <div class="label-small mb-2">DIFICULDADE</div>
            <div class="flex items-center justify-center gap-2">
              <button class="diff-btn active" data-diff="easy">FÁCIL</button>
              <button class="diff-btn" data-diff="normal">NORMAL</button>
              <button class="diff-btn" data-diff="hard">DIFÍCIL</button>
            </div>
          </div>

          <div class="flex items-center justify-center gap-2 mt-2">
            <span class="label-small">BEST</span>
            <span id="bestStart" class="pixel text-yellow-300 text-lg">0</span>
          </div>
        </div>
        <button id="startBtn" class="btn-flap">JOGAR</button>
        <div class="flex gap-3">
          <button id="lbBtn" class="btn-ghost">RANKING</button>
          <button id="achBtn" class="btn-ghost">CONQUISTAS</button>
          <button id="shopBtn" class="btn-ghost">LOJA</button>
        </div>
        <button id="zenBtn" class="btn-ghost mt-2">🧘 MODO ZEN</button>
      </div>
    </div>

    <!-- Leaderboard screen -->
    <div id="lbScreen" class="overlay hidden">
      <div class="float-in glass-card scroll-y" style="max-width:360px">
        <h2 class="pixel text-base text-yellow-300 mb-4">RANKING</h2>
        <div id="lbList" class="flex flex-col gap-2"></div>
        <button id="lbBackBtn" class="btn-ghost mt-4">VOLTAR</button>
      </div>
    </div>

    <!-- Achievements screen -->
    <div id="achScreen" class="overlay hidden">
      <div class="float-in glass-card scroll-y" style="max-width:360px">
        <h2 class="pixel text-base text-yellow-300 mb-4">CONQUISTAS</h2>
        <div id="achList" class="flex flex-col gap-2 items-start"></div>
        <button id="achBackBtn" class="btn-ghost mt-4">VOLTAR</button>
      </div>
    </div>

    <!-- Weather indicator -->
    <div id="weatherIndicator" class="weather-indicator hidden">☀️</div>

    <!-- Zen HUD -->
    <div id="zenHud" class="zen-hud">
      <span id="zenScore" class="big">0</span>
      <span id="zenTimer">—</span>
    </div>

    <!-- Coin HUD -->
    <div id="coinHud" class="coin-hud hidden">
      <span class="coin-icon">🪙</span>
      <span id="coinCount">0</span>
    </div>

    <!-- Shop screen -->
    <div id="shopScreen" class="overlay hidden">
      <div class="float-in glass-card" style="max-width:380px;width:92%;">
        <div class="flex items-center justify-center gap-2 mb-3">
          <h2 class="pixel text-base text-yellow-300">LOJA</h2>
          <span class="coin-icon">🪙</span>
          <span id="shopCoins" class="pixel text-sm text-yellow-300">0</span>
        </div>
        <div class="tab-row">
          <button class="tab-btn active" data-tab="shop-skins">SKINS</button>
          <button class="tab-btn" data-tab="shop-powers">POWER-UP</button>
          <button class="tab-btn" data-tab="shop-missions">MISSÕES</button>
        </div>
        <div id="shopSkins" class="scroll-y" style="max-height:40vh"></div>
        <div id="shopPowers" class="scroll-y hidden" style="max-height:40vh"></div>
        <div id="shopMissions" class="scroll-y hidden" style="max-height:40vh"></div>
        <button id="shopBackBtn" class="btn-ghost mt-4">VOLTAR</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="float-in flex flex-col items-center gap-5">
        <h2 class="pixel text-xl text-white">PAUSADO</h2>
        <button id="resumeBtn" class="btn-flap">CONTINUAR</button>
        <button id="quitBtn" class="btn-ghost">SAIR</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="overScreen" class="overlay hidden">
      <div class="float-in flex flex-col items-center gap-4">
        <h2 class="pixel text-xl text-red-400" style="text-shadow:2px 2px 0 rgba(0,0,0,0.3)">GAME OVER</h2>
        <div class="glass-card">
          <div id="medalSlot" class="medal medal-none mx-auto mb-3">—</div>
          <div class="flex gap-8 justify-center">
            <div>
              <div class="label-small mb-1">SCORE</div>
              <div id="finalScore" class="pixel text-2xl text-white">0</div>
            </div>
            <div>
              <div class="label-small mb-1">BEST</div>
              <div id="finalBest" class="pixel text-2xl text-yellow-300">0</div>
            </div>
          </div>
          <div id="newRecord" class="pixel text-xs text-yellow-300 mt-3 hidden blink">NEW RECORD!</div>
          <div id="achEarned" class="flex flex-wrap justify-center gap-2 mt-3"></div>
        </div>
        <button id="retryBtn" class="btn-flap">JOGAR DE NOVO</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  FLAPPY BIRD+ — Canvas 2D Engine with extra features
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

// Logical resolution (game world)
const W = 480, H = 800;
const GROUND_H = 112;

// DPI scaling
function resize() {
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (Web Audio API) ----------
let audioCtx = null;
let soundOn = localStorage.getItem('flappy_sound') !== '0';
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playTone(freq, duration, type, vol) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sndFlap()  { playTone(600, 0.08, 'square', 0.1); }

// ---------- Power-up system ----------
function spawnPowerup() {
  const types = ['shield', 'slow'];
  const type = types[Math.floor(Math.random() * types.length)];
  const minTop = 100;
  const maxTop = H - GROUND_H - 100;
  powerups.push({
    x: W + 30,
    y: minTop + Math.random() * (maxTop - minTop),
    type: type,
    r: 16,
    bob: Math.random() * Math.PI * 2,
    collected: false,
  });
}

function collectPowerup(pu) {
  pu.collected = true;
  gameStats.powerupsCollected++;
  sndPowerup();

  if (pu.type === 'shield') {
    shieldActive = true;
    shieldTimer = 300; // 5 seconds at 60fps
    gameStats.usedShield = true;
    puShield.classList.remove('inactive');
  } else if (pu.type === 'slow') {
    slowActive = true;
    slowTimer = 360; // 6 seconds
    slowFactor = 0.5;
    gameStats.usedSlow = true;
    puSlow.classList.remove('inactive');
  }

  // Collection particles
  for (let i = 0; i < 16; i++) {
    const a = (Math.PI * 2 * i) / 16;
    particles.push({
      x: pu.x, y: pu.y,
      vx: Math.cos(a) * 3,
      vy: Math.sin(a) * 3,
      life: 30, maxLife: 30,
      size: 3 + Math.random() * 2,
      color: pu.type === 'shield' ? '#00BFFF' : '#BA55D3',
    });
  }
}

function updatePowerupTimers() {
  if (shieldActive) {
    shieldTimer--;
    puShieldTimer.textContent = Math.ceil(shieldTimer / 60);
    if (shieldTimer <= 0) {
      shieldActive = false;
      puShield.classList.add('inactive');
      puShieldTimer.textContent = '';
    }
  }
  if (slowActive) {
    slowTimer--;
    puSlowTimer.textContent = Math.ceil(slowTimer / 60);
    if (slowTimer <= 0) {
      slowActive = false;
      slowFactor = 1;
      puSlow.classList.add('inactive');
      puSlowTimer.textContent = '';
    }
  }
}

// ---------- Pipe spawning ----------
function spawnPipe() {
  const minTop = 80;
  const maxTop = H - GROUND_H - currentGap - 80;
  const topH = minTop + Math.random() * (maxTop - minTop);
  // 30% chance of oscillating pipe (after score 5)
  const oscillating = score >= 5 && Math.random() < 0.3;
  pipes.push({
    x: W + 20,
    topH: topH,
    baseTopH: topH,
    gap: currentGap,
    passed: false,
    scored: false,
    oscillating: oscillating,
    oscAmp: 20 + Math.random() * 30,
    oscPhase: Math.random() * Math.PI * 2,
    oscSpeed: 0.02 + Math.random() * 0.02,
  });
}

// ---------- Collision ----------
function checkCollision() {
  if (bird.y + bird.r >= H - GROUND_H) {
    bird.y = H - GROUND_H - bird.r;
    if (shieldActive) { shieldActive = false; shieldTimer = 0; puShield.classList.add('inactive'); puShieldTimer.textContent = ''; gameStats.shieldSave = true; sndShield(); flashAlpha = 0.5; return false; }
    return true;
  }
  if (bird.y - bird.r <= 0) {
    bird.y = bird.r;
    bird.vy = 0;
  }
  for (const p of pipes) {
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 72) {
      if (bird.y - bird.r < p.topH || bird.y + bird.r > p.topH + p.gap) {
        if (shieldActive) {
          shieldActive = false;
          shieldTimer = 0;
          puShield.classList.add('inactive');
          puShieldTimer.textContent = '';
          gameStats.shieldSave = true;
          sndShield();
          flashAlpha = 0.5;
          shakeT = 6;
          // Push bird away from pipe
          if (bird.y - bird.r < p.topH) bird.vy = diff.flap * 0.7;
          else bird.vy = diff.flap;
          return false;
        }
        return true;
      }
    }
  }
  // Power-up collision
  for (const pu of powerups) {
    if (!pu.collected) {
      const dx = bird.x - pu.x;
      const dy = bird.y - pu.y;
      if (Math.sqrt(dx*dx + dy*dy) < bird.r + pu.r) {
        collectPowerup(pu);
      }
    }
  }
  return false;
}

// ---------- Update (main game logic) ----------
function gameUpdate() {
  frame++;

  // Clouds always move
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 200; }
  }

  // Stars twinkle
  for (const s of stars) {
    s.twinkle += s.speed;
  }

  // Mountains parallax
  for (const m of mountains) {
    m.x -= m.speed;
    if (m.x + m.w < 0) { m.x = W; m.h = 80 + Math.random() * 60; m.w = 120 + Math.random() * 60; }
  }

  if (state === STATE.PLAYING) {
    const sf = slowFactor; // slow-motion factor

    // Bird physics
    bird.vy += diff.grav * sf;
    bird.y += bird.vy * sf;
    bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy * 0.08));
    bird.wingPhase += 0.3;

    // Trail
    bird.trail.push({ x: bird.x, y: bird.y, life: 15 });
    if (bird.trail.length > 12) bird.trail.shift();
    for (const t of bird.trail) t.life--;

    // Progressive difficulty
    currentSpeed = Math.min(diff.speed + score * diff.progSpeed, diff.speed + 1.5);
    currentGap = Math.max(diff.gap - score * diff.progGap, diff.gap - 40);

    // Day/Night cycle
    if (score >= 15 && !reachedNight) {
      reachedNight = true;
    }
    if (score >= 15) {
      nightTransition = Math.min(1, nightTransition + 0.005);
      isNight = nightTransition > 0.5;
    }

    // Spawn pipes
    pipeSpawnTimer++;
    if (pipeSpawnTimer >= currentInterval) {
      spawnPipe();
      pipeSpawnTimer = 0;
    }

    // Spawn power-ups (every ~8-12 seconds)
    powerupSpawnTimer++;
    if (powerupSpawnTimer >= 480 + Math.random() * 240) {
      spawnPowerup();
      powerupSpawnTimer = 0;
    }

    // Move pipes
    for (const p of pipes) {
      p.x -= currentSpeed * sf;
      // Oscillating pipes
      if (p.oscillating) {
        p.oscPhase += p.oscSpeed;
        p.topH = p.baseTopH + Math.sin(p.oscPhase) * p.oscAmp;
        // Clamp
        p.topH = Math.max(60, Math.min(H - GROUND_H - p.gap - 60, p.topH));
      }
      if (!p.passed && p.x + 72 < bird.x) {
        p.passed = true;
        p.scored = true;
        score++;
        if (p.oscillating) oscillPassed++;
        sndScore();
        hudScore.textContent = score;
        hudScore.classList.add('pop');
        setTimeout(() => hudScore.classList.remove('pop'), 150);

        // Score popup
        scorePopups.push({ x: bird.x, y: bird.y - 30, text: '+1', life: 40, vy: -1.5 });

        // Combo system
        combo++;
        comboTimer = 120;
        if (combo > maxCombo) maxCombo = combo;
        if (combo >= 2) {
          hudCombo.textContent = 'COMBO x' + combo;
          hudCombo.classList.add('show');
          sndCombo();
        }

        // score particles
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: bird.x, y: bird.y,
            vx: (Math.random() - 0.5) * 4,
            vy: -1 - Math.random() * 3,
            life: 25, maxLife: 25,
            size: 2 + Math.random() * 2,
            color: SKINS[skinIdx].body,
          });
        }
      }
    }
    pipes = pipes.filter(p => p.x + 72 > -10);

    // Move power-ups
    for (const pu of powerups) {
      pu.x -= currentSpeed * sf;
      pu.bob += 0.05;
      pu.y += Math.sin(pu.bob) * 0.5;
    }
    powerups = powerups.filter(pu => pu.x > -30 && !pu.collected);

    // Combo timer
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) {
        combo = 0;
        hudCombo.classList.remove('show');
      }
    }

    // Power-up timers
    updatePowerupTimers();

    // Ground scroll
    groundOffset = (groundOffset + currentSpeed * sf) % 40;

    // Collision
    if (checkCollision()) gameOver();

    // Zen mode update (when playing zen)
    if (zenActive) updateZenMode();

  } else if (state === STATE.START) {
    // Idle bob
    bird.y = H * 0.42 + Math.sin(frame * 0.05) * 12;
    bird.rot = Math.sin(frame * 0.05) * 0.1;
    bird.wingPhase += 0.2;
    groundOffset = (groundOffset + 1.5) % 40;

  } else if (state === STATE.OVER) {
    // Bird falls
    if (bird.y + bird.r < H - GROUND_H) {
      bird.vy += diff.grav * 0.6;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 2, bird.rot + 0.05);
    }
  }

  // Weather (always)
  updateWeather();

  // Particles
  for (const pt of particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.15;
    pt.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Score popups
  for (const sp of scorePopups) {
    sp.y += sp.vy;
    sp.life--;
  }
  scorePopups = scorePopups.filter(s => s.life > 0);

  // Flash decay
  if (flashAlpha > 0) flashAlpha *= 0.88;
  if (shakeT > 0) shakeT--;
}

// ---------- Drawing ----------
function drawSky() {
  const dayColors = ['#FF6B6B', '#FFA07A', '#87CEEB', '#4ECDC4'];
  const nightColors = ['#0a0e27', '#1a1a3e', '#2d2d5e', '#3d3b7c'];
  const t = nightTransition;
  const blend = (d, n) => {
    const dr = parseInt(d.slice(1,3),16), dg = parseInt(d.slice(3,5),16), db = parseInt(d.slice(5,7),16);
    const nr = parseInt(n.slice(1,3),16), ng = parseInt(n.slice(3,5),16), nb = parseInt(n.slice(5,7),16);
    const r = Math.round(dr + (nr-dr)*t), g = Math.round(dg + (ng-dg)*t), b = Math.round(db + (nb-db)*t);
    return `rgb(${r},${g},${b})`;
  };

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, blend(dayColors[0], nightColors[0]));
  g.addColorStop(0.35, blend(dayColors[1], nightColors[1]));
  g.addColorStop(0.65, blend(dayColors[2], nightColors[2]));
  g.addColorStop(1, blend(dayColors[3], nightColors[3]));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars (visible at night)
  if (t > 0.1) {
    for (const s of stars) {
      const tw = 0.5 + Math.sin(s.twinkle) * 0.5;
      ctx.globalAlpha = t * tw;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Sun/Moon glow
  const sx = W * 0.75, sy = H * 0.22;
  if (t < 0.6) {
    const sa = 1 - t * 1.5;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120);
    sg.addColorStop(0, `rgba(255,255,200,${0.6 * sa})`);
    sg.addColorStop(1, `rgba(255,255,200,0)`);
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 120, sy - 120, 240, 240);
    ctx.fillStyle = `rgba(255,240,180,${0.8 * sa})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 36, 0, Math.PI * 2);
    ctx.fill();
  }
  if (t > 0.4) {
    const ma = (t - 0.4) / 0.6;
    const mx = W * 0.75, my = H * 0.18;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 100);
    mg.addColorStop(0, `rgba(230,230,255,${0.4 * ma})`);
    mg.addColorStop(1, `rgba(230,230,255,0)`);
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 100, my - 100, 200, 200);
    ctx.fillStyle = `rgba(240,240,255,${0.9 * ma})`;
    ctx.beginPath();
    ctx.arc(mx, my, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(200,200,220,${0.5 * ma})`;
    ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 6, my + 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 10, my - 10, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Slow-motion overlay
  if (slowActive) {
    ctx.fillStyle = 'rgba(186,85,211,0.08)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawMountains() {
  const groundY = H - GROUND_H;
  const t = nightTransition;
  const dayCol = `rgba(80,100,120,0.4)`;
  const nightCol = `rgba(30,30,60,0.5)`;
  ctx.fillStyle = t < 0.5 ? dayCol : nightCol;
  for (const m of mountains) {
    ctx.beginPath();
    ctx.moveTo(m.x, groundY);
    ctx.lineTo(m.x + m.w / 2, groundY - m.h);
    ctx.lineTo(m.x + m.w, groundY);
    ctx.closePath();
    ctx.fill();
  }
}

function drawClouds() {
  const t = nightTransition;
  const alpha = 0.7 * (1 - t * 0.5);
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, -6, 28, 0, Math.PI * 2);
    ctx.arc(52, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, 12, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPipe(p) {
  const x = p.x;
  const topH = p.topH;
  const botY = p.topH + p.gap;
  const botH = H - GROUND_H - botY;
  const PW = 72;

  // Pipe body gradient
  const pg = ctx.createLinearGradient(x, 0, x + PW, 0);
  if (p.oscillating) {
    pg.addColorStop(0, '#7C3AED');
    pg.addColorStop(0.3, '#A78BFA');
    pg.addColorStop(0.5, '#C4B5FD');
    pg.addColorStop(0.7, '#A78BFA');
    pg.addColorStop(1, '#7C3AED');
  } else {
    pg.addColorStop(0, '#1A9388');
    pg.addColorStop(0.3, '#2EC4B6');
    pg.addColorStop(0.5, '#3DD8CA');
    pg.addColorStop(0.7, '#2EC4B6');
    pg.addColorStop(1, '#1A9388');
  }

  // Top pipe
  ctx.fillStyle = pg;
  ctx.fillRect(x, 0, PW, topH - 24);
  ctx.fillRect(x - 4, topH - 24, PW + 8, 24);

  // Bottom pipe
  ctx.fillRect(x, botY + 24, PW, botH - 24);
  ctx.fillRect(x - 4, botY, PW + 8, 24);

  // Highlights
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 8, 0, 6, topH - 24);
  ctx.fillRect(x + 8, botY + 24, 6, botH - 24);
  ctx.fillRect(x - 2, topH - 22, PW + 4, 4);
  ctx.fillRect(x - 2, botY + 2, PW + 4, 4);

  // Dark edges
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x + PW - 10, 0, 8, topH - 24);
  ctx.fillRect(x + PW - 10, botY + 24, 8, botH - 24);

  // Oscillating indicator (wave icon)
  if (p.oscillating) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('〰', x + PW/2, topH - 8);
    ctx.fillText('〰', x + PW/2, botY + 18);
  }
}

function drawPowerups() {
  for (const pu of powerups) {
    if (pu.collected) continue;
    ctx.save();
    ctx.translate(pu.x, pu.y);

    // Glow
    const glowColor = pu.type === 'shield' ? 'rgba(0,191,255,0.3)' : 'rgba(186,85,211,0.3)';
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, pu.r + 12);
    gg.addColorStop(0, glowColor);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(-pu.r - 12, -pu.r - 12, (pu.r + 12) * 2, (pu.r + 12) * 2);

    // Body
    const bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, pu.r);
    if (pu.type === 'shield') {
      bg.addColorStop(0, '#7FDBFF');
      bg.addColorStop(0.6, '#00BFFF');
      bg.addColorStop(1, '#006994');
    } else {
      bg.addColorStop(0, '#DDA0DD');
      bg.addColorStop(0.6, '#BA55D3');
      bg.addColorStop(1, '#663399');
    }
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(0, 0, pu.r, 0, Math.PI * 2);
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Icon
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pu.type === 'shield' ? '🛡' : '⏳', 0, 1);

    ctx.restore();
  }
}

function drawTrail() {
  const sk = SKINS[skinIdx];
  for (let i = 0; i < bird.trail.length; i++) {
    const t = bird.trail[i];
    const alpha = (t.life / 15) * 0.3;
    const size = (i / bird.trail.length) * bird.r * 0.8;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = sk.body;
    ctx.beginPath();
    ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBird() {
  const sk = SKINS[skinIdx];
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  // Shield aura
  if (shieldActive) {
    const pulse = 0.5 + Math.sin(frame * 0.2) * 0.2;
    const sg = ctx.createRadialGradient(0, 0, bird.r, 0, 0, bird.r + 12);
    sg.addColorStop(0, `rgba(0,191,255,${0.3 * pulse})`);
    sg.addColorStop(1, 'rgba(0,191,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(-bird.r - 12, -bird.r - 12, (bird.r + 12) * 2, (bird.r + 12) * 2);
    ctx.strokeStyle = `rgba(0,191,255,${0.6 * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, bird.r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  const r = bird.r;

  // Body
  const bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, r + 4);
  bg.addColorStop(0, sk.body);
  bg.addColorStop(0.6, sk.body);
  bg.addColorStop(1, sk.dark);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = sk.belly;
  ctx.beginPath();
  ctx.arc(2, 6, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  const wingY = Math.sin(bird.wingPhase) * 5;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(-6, 2 + wingY, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = sk.dark;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = sk.eye;
  ctx.beginPath();
  ctx.arc(10, -6, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(11, -7, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = sk.beak;
  ctx.beginPath();
  ctx.moveTo(r - 2, -2);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#E07000';
  ctx.beginPath();
  ctx.moveTo(r - 2, 1);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  const y = H - GROUND_H;
  const t = nightTransition;
  const groundCol = t < 0.5 ? '#DEB887' : '#5d4e3a';
  ctx.fillStyle = groundCol;
  ctx.fillRect(0, y, W, GROUND_H);

  const grassCol = t < 0.5 ? '#7CB342' : '#3a5a2a';
  const grassLight = t < 0.5 ? '#9CCC65' : '#4a6a3a';
  ctx.fillStyle = grassCol;
  ctx.fillRect(0, y, W, 16);
  ctx.fillStyle = grassLight;
  ctx.fillRect(0, y, W, 6);

  const patternCol = t < 0.5 ? '#C19A6B' : '#4d3e2a';
  ctx.fillStyle = patternCol;
  for (let i = -1; i < W / 40 + 1; i++) {
    const gx = i * 40 - groundOffset;
    ctx.beginPath();
    ctx.moveTo(gx, y + 16);
    ctx.lineTo(gx + 20, y + 16);
    ctx.lineTo(gx + 10, y + GROUND_H);
    ctx.lineTo(gx - 10, y + GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, y + 16, W, 3);
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawScorePopups() {
  for (const sp of scorePopups) {
    const alpha = sp.life / 40;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFD93D';
    ctx.font = 'bold 20px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(sp.text, sp.x, sp.y);
    ctx.globalAlpha = 1;
  }
}

function drawFlash() {
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Main loop ----------
// ============================================================
//  WEATHER SYSTEM
// ============================================================
const WEATHERS = [
  { id: 'clear',  icon: '☀️', label: 'Limpo',       precip: 0 },
  { id: 'rain',   icon: '🌧️', label: 'Chuva',        precip: 1, color: 'rgba(174,194,224,0.5)' },
  { id: 'storm',  icon: '⛈️', label: 'Tempestade',   precip: 1, color: 'rgba(80,100,140,0.6)', lightning: true },
  { id: 'snow',   icon: '❄️', label: 'Neve',         precip: 2, color: 'rgba(255,255,255,0.7)' },
  { id: 'wind',   icon: '💨', label: 'Vento',        precip: 0, windStr: 3 },
];
let currentWeather = WEATHERS[0];
let weatherParticles = [];
let weatherTimer = 0;
let weatherDuration = 600; // frames
let weatherFlashTimer = 0;
let weatherChangePending = false;

function changeWeather(w) {
  currentWeather = w;
  weatherTimer = 0;
  weatherDuration = 600 + Math.floor(Math.random() * 400);
  const el = document.getElementById('weatherIndicator');
  if (el) { el.textContent = w.icon; el.classList.remove('hidden'); }
  // Clear old weather particles
  weatherParticles = [];
}

function randomWeather() {
  const idx = Math.floor(Math.random() * WEATHERS.length);
  changeWeather(WEATHERS[idx]);
}

function updateWeather() {
  if (state !== STATE.PLAYING && state !== STATE.START) { weatherParticles = []; return; }
  weatherTimer++;

  // Change weather every 10-20 seconds
  if (weatherTimer > weatherDuration) {
    // Don't change during lightning flash
    if (weatherFlashTimer <= 0) randomWeather();
  }

  // Spawn particles based on weather
  const isPlay = state === STATE.PLAYING;
  const sf = isPlay && slowActive ? slowFactor : 1;

  if (currentWeather.id === 'rain') {
    if (Math.random() < 0.4 * sf) {
      weatherParticles.push({
        x: Math.random() * W,
        y: -10,
        vx: -0.5,
        vy: 8 + Math.random() * 4,
        life: 60,
        size: 1 + Math.random(),
        color: 'rgba(174,194,224,0.5)',
        type: 'rain',
        len: 10 + Math.random() * 6,
      });
    }
  } else if (currentWeather.id === 'storm') {
    if (Math.random() < 0.7 * sf) {
      weatherParticles.push({
        x: Math.random() * W,
        y: -10,
        vx: -1,
        vy: 10 + Math.random() * 6,
        life: 50,
        size: 1.5 + Math.random(),
        color: 'rgba(80,100,140,0.6)',
        type: 'rain',
        len: 14 + Math.random() * 8,
      });
    }
    // Lightning
    if (weatherFlashTimer > 0) weatherFlashTimer--;
    if (Math.random() < 0.003 && weatherFlashTimer <= 0) {
      weatherFlashTimer = 8;
    }
  } else if (currentWeather.id === 'snow') {
    if (Math.random() < 0.15 * sf) {
      weatherParticles.push({
        x: Math.random() * W,
        y: -10,
        vx: -0.3 + Math.random() * 0.6,
        vy: 1.5 + Math.random() * 1.5,
        life: 80 + Math.random() * 40,
        size: 2 + Math.random() * 4,
        color: 'rgba(255,255,255,0.8)',
        type: 'snow',
        wobble: Math.random() * Math.PI * 2,
      });
    }
  } else if (currentWeather.id === 'wind') {
    if (Math.random() < 0.5 * sf) {
      weatherParticles.push({
        x: -20,
        y: Math.random() * H,
        vx: 6 + Math.random() * 4,
        vy: (Math.random() - 0.5) * 1.5,
        life: 40 + Math.random() * 20,
        size: 1 + Math.random() * 2,
        color: 'rgba(200,220,255,0.2)',
        type: 'wind',
        len: 20 + Math.random() * 20,
      });
    }
  }

  // Update particles
  for (const p of weatherParticles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.type === 'snow') {
      p.wobble += 0.03;
      p.x += Math.sin(p.wobble) * 0.5;
    }
    p.life--;
  }
  weatherParticles = weatherParticles.filter(p => p.life > 0 && p.y < H + 20 && p.x > -30 && p.x < W + 30);
}

function drawWeather() {
  ctx.save();

  // Lightning flash
  if (currentWeather.id === 'storm' && weatherFlashTimer > 0) {
    const alpha = (weatherFlashTimer / 8) * 0.6;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Weather overlay (subtle tint)
  if (currentWeather.id === 'rain') {
    ctx.fillStyle = 'rgba(174,194,224,0.06)';
    ctx.fillRect(0, 0, W, H);
  } else if (currentWeather.id === 'storm') {
    ctx.fillStyle = 'rgba(40,50,80,0.15)';
    ctx.fillRect(0, 0, W, H);
  } else if (currentWeather.id === 'snow') {
    ctx.fillStyle = 'rgba(200,220,255,0.04)';
    ctx.fillRect(0, 0, W, H);
  }

  for (const p of weatherParticles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    if (p.type === 'rain') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.vx * 1.5, p.y - p.len);
      ctx.stroke();
    } else if (p.type === 'snow') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'wind') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.len, p.y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

let zenMode = false;
let zenScore = 0;
let zenTimer = 0;
let zenMaxTime = 60 * 60; // 60 seconds at 60fps
let zenItems = [];
let zenActive = false;

function startZenMode() {
  state = STATE.PLAYING;
  zenMode = true;
  zenScore = 0;
  zenTimer = zenMaxTime;
  zenItems = [];
  zenActive = true;
  bird.y = H * 0.42;
  bird.vy = 0;
  bird.rot = 0;
  bird.trail = [];
  pipes = [];
  particles = [];
  scorePopups = [];
  powerups = [];
  score = 0;
  frame = 0;
  flashAlpha = 0;
  combo = 0;
  isNight = false;
  nightTransition = 0;
  shieldActive = false;
  shieldTimer = 0;
  slowActive = false;
  slowTimer = 0;

  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  hudScore.classList.add('hidden');
  hudPause.classList.add('hidden');
  hudSound.classList.add('hidden');
  hudPowerups.classList.add('hidden');

  document.getElementById('zenHud').classList.add('show');
  document.getElementById('coinHud').classList.remove('hidden');
  updateZenHud();
}

function spawnZenItem() {
  const types = ['star', 'moon', 'gem', 'heart', 'note'];
  const type = types[Math.floor(Math.random() * types.length)];
  const icons = { star: '⭐', moon: '🌙', gem: '💎', heart: '❤️', note: '🎵' };
  const points = { star: 1, moon: 3, gem: 5, heart: 2, note: 4 };
  const minY = 60;
  const maxY = H - GROUND_H - 40;
  zenItems.push({
    x: W + 30,
    y: minY + Math.random() * (maxY - minY),
    type: type,
    icon: icons[type],
    points: points[type],
    r: 14,
    bob: Math.random() * Math.PI * 2,
    collected: false,
    speed: 0.8 + Math.random() * 0.5,
  });
}

function updateZenMode() {
  if (!zenActive) return;
  const sf = slowActive ? slowFactor : 1;

  // Bird physics (gentler)
  bird.vy += 0.35 * sf;
  bird.y += bird.vy * sf;
  bird.rot = Math.max(-0.3, Math.min(1.2, bird.vy * 0.07));
  bird.wingPhase += 0.25;

  // Trail
  bird.trail.push({ x: bird.x, y: bird.y, life: 12 });
  if (bird.trail.length > 10) bird.trail.shift();
  for (const t of bird.trail) t.life--;

  // Boundaries
  if (bird.y + bird.r >= H - GROUND_H) { bird.y = H - GROUND_H - bird.r; bird.vy = 0; }
  if (bird.y - bird.r <= 0) { bird.y = bird.r; bird.vy = 0; }

  // Timer
  zenTimer--;
  if (zenTimer % 60 === 0) updateZenHud();

  // Spawn items
  if (Math.random() < 0.02 * sf) spawnZenItem();

  // Move items
  for (const item of zenItems) {
    item.x -= item.speed * sf;
    item.bob += 0.05;
    item.y += Math.sin(item.bob) * 0.5;

    // Collect items
    const dx = bird.x - item.x;
    const dy = bird.y - item.y;
    if (Math.sqrt(dx*dx + dy*dy) < bird.r + item.r && !item.collected) {
      item.collected = true;
      zenScore += item.points;
      coins += item.points;
      localStorage.setItem('flappy_coins', String(coins));
      updateCoinHud();
      updateZenHud();
      sndScore();

      // Collection particles
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8;
        particles.push({
          x: item.x, y: item.y,
          vx: Math.cos(a) * 2.5,
          vy: Math.sin(a) * 2.5,
          life: 20, maxLife: 20,
          size: 3 + Math.random() * 2,
          color: '#FFD93D',
        });
      }

      // Popup
      scorePopups.push({ x: item.x, y: item.y - 20, text: '+' + item.points, life: 35, vy: -1.5 });
    }
  }
  zenItems = zenItems.filter(item => item.x > -30 && !item.collected);

  // Ground scroll
  groundOffset = (groundOffset + 1.2 * sf) % 40;

  // Time up
  if (zenTimer <= 0) {
    endZenMode();
  }
}

function endZenMode() {
  zenActive = false;
  zenMode = false;
  state = STATE.START;
  document.getElementById('zenHud').classList.remove('show');
  document.getElementById('coinHud').classList.add('hidden');
  hudScore.classList.add('hidden');
  zenItems = [];

  // Show summary
  const zenBest = parseInt(localStorage.getItem('flappy_zen_best') || '0', 10);
  if (zenScore > zenBest) {
    localStorage.setItem('flappy_zen_best', String(zenScore));
  }
  // Check missions
  checkMissions();
  startScreen.classList.remove('hidden');
}

function updateZenHud() {
  const el = document.getElementById('zenScore');
  const timer = document.getElementById('zenTimer');
  if (el) el.textContent = zenScore;
  if (timer) {
    const secs = Math.ceil(zenTimer / 60);
    timer.textContent = formatTime(secs);
  }
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ============================================================
//  COINS & SHOP
// ============================================================
let coins = parseInt(localStorage.getItem('flappy_coins') || '0', 10);

const SHOP_ITEMS = [
  // Skins (buyable)
  { id: 'skin_ghost',  type: 'skin', name: 'Ghost',   price: 50,  icon: '👻', skinIdx: 4 },
  { id: 'skin_neon',   type: 'skin', name: 'Neon',    price: 100, icon: '💚', skinIdx: 5 },
  // Power-ups
  { id: 'pu_shield',   type: 'power', name: 'Escudo+', price: 30, icon: '🛡', desc: 'Começa com escudo (5s)' },
  { id: 'pu_slow',     type: 'power', name: 'Slow+',   price: 40, icon: '⏳', desc: 'Começa com slow-motion (6s)' },
  { id: 'pu_both',     type: 'power', name: 'Combo+',  price: 60, icon: '⚡', desc: 'Escudo + Slow no início' },
];

let ownedItems = JSON.parse(localStorage.getItem('flappy_shop_owned') || '{}');

function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item || ownedItems[itemId] || coins < item.price) return false;
  coins -= item.price;
  ownedItems[itemId] = true;
  localStorage.setItem('flappy_coins', String(coins));
  localStorage.setItem('flappy_shop_owned', JSON.stringify(ownedItems));
  updateCoinHud();
  return true;
}

function updateCoinHud() {
  const el = document.getElementById('coinCount');
  const shopEl = document.getElementById('shopCoins');
  if (el) el.textContent = coins;
  if (shopEl) shopEl.textContent = coins;
}

// Apply owned powerups when game starts
function applyShopPowerups() {
  // These are applied after startGame
  setTimeout(() => {
    const started = state === STATE.PLAYING && !zenMode;
    if (!started) return;
    // Apply shield
    if (ownedItems['pu_shield'] || ownedItems['pu_both']) {
      shieldActive = true;
      shieldTimer = 300;
      puShield.classList.remove('inactive');
    }
    // Apply slow
    if (ownedItems['pu_slow']) {
      slowActive = true;
      slowTimer = 360;
      slowFactor = 0.5;
      puSlow.classList.remove('inactive');
    }
    if (ownedItems['pu_both'] && !ownedItems['pu_slow']) {
      slowActive = true;
      slowTimer = 360;
      slowFactor = 0.5;
      puSlow.classList.remove('inactive');
    }
  }, 100);
}

function renderShop(tab) {
  const skinsDiv = document.getElementById('shopSkins');
  const powersDiv = document.getElementById('shopPowers');
  const missionsDiv = document.getElementById('shopMissions');

  // Skins tab
  skinsDiv.innerHTML = '';
  SHOP_ITEMS.filter(i => i.type === 'skin').forEach(item => {
    const owned = ownedItems[item.id] || item.skinIdx <= 3;
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '');
    div.innerHTML = `
      <span>${item.icon} ${item.name}</span>
      <span>${owned ? '✅' : '🪙 ' + item.price}</span>
    `;
    if (!owned) {
      const btn = document.createElement('button');
      btn.className = 'shop-btn';
      btn.textContent = 'COMPRAR';
      btn.addEventListener('click', () => {
        if (buyItem(item.id)) renderShop('shop-skins');
      });
      div.appendChild(btn);
    } else {
      const badge = document.createElement('span');
      badge.className = 'shop-btn owned-btn';
      badge.textContent = 'POSSUI';
      div.appendChild(badge);
    }
    skinsDiv.appendChild(div);
  });

  // Powers tab
  powersDiv.innerHTML = '';
  SHOP_ITEMS.filter(i => i.type === 'power').forEach(item => {
    const owned = ownedItems[item.id];
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '');
    div.innerHTML = `
      <span>${item.icon} ${item.name}</span>
      <span style="font-size:7px;color:rgba(255,255,255,0.6)">${item.desc}</span>
      <span>${owned ? '✅' : '🪙 ' + item.price}</span>
    `;
    if (!owned) {
      const btn = document.createElement('button');
      btn.className = 'shop-btn';
      btn.textContent = 'COMPRAR';
      btn.addEventListener('click', () => {
        if (buyItem(item.id)) renderShop('shop-powers');
      });
      div.appendChild(btn);
    } else {
      const badge = document.createElement('span');
      badge.className = 'shop-btn owned-btn';
      badge.textContent = 'POSSUI';
      div.appendChild(badge);
    }
    powersDiv.appendChild(div);
  });

  // Missions tab
  missionsDiv.innerHTML = '';
  renderMissions(missionsDiv);
}

// ============================================================
//  MISSIONS
// ============================================================
let missions = JSON.parse(localStorage.getItem('flappy_missions') || 'null');
let missionProgress = JSON.parse(localStorage.getItem('flappy_mission_progress') || '{}');

function generateDailyMissions() {
  const today = new Date().toDateString();
  const saved = localStorage.getItem('flappy_missions_date');
  if (saved === today && missions) return;

  const allMissions = [
    { id: 'score10',  name: 'Pontuador',     desc: 'Marque 10 pontos',       need: 10, reward: 15 },
    { id: 'score20',  name: 'Voador',        desc: 'Marque 20 pontos',       need: 20, reward: 25 },
    { id: 'combo3',   name: 'Combinador',    desc: 'Combo x3',               need: 3,  reward: 10 },
    { id: 'combo5',   name: 'Mestre Combo',  desc: 'Combo x5',               need: 5,  reward: 20 },
    { id: 'power2',   name: 'Colecionador',  desc: 'Pegue 2 power-ups',      need: 2,  reward: 15 },
    { id: 'zen50',    name: 'Zen Mestre',    desc: '50 pts no Modo Zen',     need: 50, reward: 30 },
    { id: 'zen100',   name: 'Iluminado',     desc: '100 pts no Modo Zen',    need: 100, reward: 50 },
    { id: 'survive30', name: 'Resistente',   desc: 'Sobreviva 30s com shield',need: 30, reward: 20 },
    { id: 'noCrash',  name: 'Precisão',      desc: 'Passe 15 canos sem colidir', need: 15, reward: 25 },
    { id: 'hard10',   name: 'Desafiador',    desc: '10 pts no Difícil',      need: 10, reward: 35 },
    { id: 'coins50',  name: 'Rico',          desc: 'Ganhe 50 moedas total',  need: 50, reward: 20 },
    { id: 'weather5', name: 'Climático',     desc: 'Jogue com 5 climas dif.', need: 5,  reward: 25 },
  ];

  // Pick 4 random missions
  const shuffled = [...allMissions].sort(() => Math.random() - 0.5);
  missions = shuffled.slice(0, 4).map(m => ({
    ...m,
    progress: missionProgress[m.id] || 0,
    completed: missionProgress[m.id + '_done'] || false,
  }));
  localStorage.setItem('flappy_missions', JSON.stringify(missions));
  localStorage.setItem('flappy_missions_date', today);
}

function checkMissions() {
  let earned = 0;
  const today = new Date().toDateString();
  const savedDate = localStorage.getItem('flappy_missions_date');
  if (savedDate !== today) { generateDailyMissions(); return; }

  missions = JSON.parse(localStorage.getItem('flappy_missions'));
  if (!missions) return;

  missions.forEach((m, i) => {
    if (m.completed) return;
    // Calculate progress based on current run
    let progress = 0;
    const mId = m.id;
    if (mId === 'score10' || mId === 'score20') progress = Math.min(m.need, score);
    else if (mId === 'combo3' || mId === 'combo5') progress = Math.min(m.need, maxCombo);
    else if (mId === 'power2') progress = Math.min(m.need, gameStats.powerupsCollected);
    else if (mId === 'zen50' || mId === 'zen100') progress = Math.min(m.need, zenScore);
    else if (mId === 'survive30') progress = Math.min(m.need, shieldTimer > 0 ? Math.floor((300 - shieldTimer) / 60) : 0);
    else if (mId === 'noCrash') progress = Math.min(m.need, score);
    else if (mId === 'hard10') progress = diffKey === 'hard' ? Math.min(m.need, score) : 0;
    else if (mId === 'coins50') progress = Math.min(m.need, parseInt(localStorage.getItem('flappy_coins') || '0', 10));
    else if (mId === 'weather5') progress = Math.min(m.need, Math.floor(weatherTimer / 600));

    m.progress = Math.max(m.progress || 0, progress);
    missionProgress[m.id] = m.progress;

    if (m.progress >= m.need && !m.completed) {
      m.completed = true;
      missionProgress[m.id + '_done'] = true;
      coins += m.reward;
      localStorage.setItem('flappy_coins', String(coins));
      updateCoinHud();
      earned += m.reward;
    }
  });

  localStorage.setItem('flappy_missions', JSON.stringify(missions));
  localStorage.setItem('flappy_mission_progress', JSON.stringify(missionProgress));

  if (earned > 0) {
    flashAlpha = 0.5;
    setTimeout(() => {
      flashAlpha = 0;
    }, 300);
  }
}

function renderMissions(container) {
  const today = new Date().toDateString();
  const savedDate = localStorage.getItem('flappy_missions_date');

  if (savedDate !== today) { generateDailyMissions(); }

  missions = JSON.parse(localStorage.getItem('flappy_missions'));
  if (!missions || missions.length === 0) {
    container.innerHTML = '<p class="text-white/40 text-sm text-center pixel" style="font-size:8px">Nenhuma missão hoje!</p>';
    return;
  }

  missions.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mission-card' + (m.completed ? ' completed' : '');
    const pct = Math.min(100, Math.round(((m.progress || 0) / m.need) * 100));
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <span>${m.completed ? '✅' : '📋'} ${m.name}</span>
        <span class="mission-reward">🪙 ${m.reward}</span>
      </div>
      <div class="text-white/40" style="font-size:7px">${m.desc}</div>
      <div class="mission-progress">
        <div class="mission-progress-bar" style="width:${pct}%"></div>
      </div>
      <div class="text-white/40 text-right" style="font-size:7px">${m.progress || 0}/${m.need}</div>
    `;
    container.appendChild(card);
  });
}

// ============================================================
//  INTEGRATED RENDER
// ============================================================
function render() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeT * 0.8,
      (Math.random() - 0.5) * shakeT * 0.8
    );
  }

  drawSky();
  drawMountains();
  drawClouds();
  drawWeather();
  drawTrail();
  for (const p of pipes) drawPipe(p);
  drawPowerups();

  // Draw zen items
  if (zenActive) {
    for (const item of zenItems) {
      if (item.collected) continue;
      ctx.save();
      ctx.translate(item.x, item.y);
      // Glow
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, item.r + 10);
      gg.addColorStop(0, 'rgba(255,217,61,0.2)');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(-item.r - 10, -item.r - 10, (item.r + 10) * 2, (item.r + 10) * 2);
      // Icon
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.icon, 0, 0);
      ctx.restore();
    }
  }

  drawGround();
  drawBird();
  drawParticles();
  drawScorePopups();
  drawFlash();

  ctx.restore();
}

// ============================================================
//  INTEGRATED UPDATE — loop entry (delegates to gameUpdate)
// ============================================================
function update() {
  gameUpdate();
}

// ============================================================
//  EVENT BINDINGS
// ============================================================
document.getElementById('shopBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  generateDailyMissions();
  updateCoinHud();
  renderShop('shop-skins');
  startScreen.classList.add('hidden');
  shopScreen.classList.remove('hidden');
  // Reset tabs
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="shop-skins"]').classList.add('active');
  document.getElementById('shopSkins').classList.remove('hidden');
  document.getElementById('shopPowers').classList.add('hidden');
  document.getElementById('shopMissions').classList.add('hidden');
});

document.getElementById('shopBackBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  shopScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('shopSkins').classList.toggle('hidden', tab !== 'shop-skins');
    document.getElementById('shopPowers').classList.toggle('hidden', tab !== 'shop-powers');
    document.getElementById('shopMissions').classList.toggle('hidden', tab !== 'shop-missions');
    renderShop(tab);
  });
});

// Zen mode button
document.getElementById('zenBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  startZenMode();
});

// Override startGame to apply shop powerups
const _origStartGame = startGame;
function startGame() {
  _origStartGame();
  applyShopPowerups();
}

// Override the loop to add our update
// (already done via monkey-patching update above)

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Init
generateDailyMissions();
updateCoinHud();

loop();
</script>
