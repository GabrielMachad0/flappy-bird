<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird+</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pipe: #2EC4B6;
    --pipe-dark: #1A9388;
    --bird: #FFD93D;
    --bird-dark: #E8A800;
    --ground: #DEB887;
    --ground-dark: #C19A6B;
    --ink: #1A535C;
    --glass: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a2a3a 0%, #0d1117 100%);
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 800px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    border-radius: 0;
  }
  @media (min-width: 481px) and (min-height: 801px) {
    #stage { border-radius: 20px; }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .btn-flap {
    background: linear-gradient(135deg, #FFD93D, #FFA500);
    color: #1A535C;
    border: none;
    padding: 14px 36px;
    border-radius: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 0 #C97F00, 0 8px 24px rgba(255,165,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn-flap:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #C97F00, 0 4px 12px rgba(255,165,0,0.3);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 24px;
    border-radius: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .btn-ghost:active { background: rgba(255,255,255,0.2); }
  .btn-ghost.active { background: rgba(255,217,61,0.25); border-color: #FFD93D; color: #FFD93D; }
  .score-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 56px;
    color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    line-height: 1;
  }
  .label-small {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .title-big {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    color: #FFD93D;
    text-shadow: 3px 3px 0 #C97F00, 0 0 40px rgba(255,217,61,0.3);
    line-height: 1.4;
  }
  .medal {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .medal-gold { background: linear-gradient(135deg, #FFD700, #B8860B); }
  .medal-silver { background: linear-gradient(135deg, #C0C0C0, #808080); }
  .medal-bronze { background: linear-gradient(135deg, #CD7F32, #8B4513); }
  .medal-platinum { background: linear-gradient(135deg, #E5E4E2, #A9A9A9); }
  .medal-none { background: linear-gradient(135deg, #555, #333); }
  .blink { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .float-in { animation: floatIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes floatIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .hud-score {
    position: absolute;
    top: 40px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 48px;
    color: #fff;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    z-index: 5;
    pointer-events: none;
    transition: transform 0.15s;
  }
  .hud-score.pop { transform: translateX(-50%) scale(1.3); }
  .hud-combo {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #FFD93D;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hud-combo.show { opacity: 1; }
  .hud-pause {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 6;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 18px;
  }
  .skin-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .skin-btn:hover { transform: scale(1.1); }
  .skin-btn.active { border-color: #FFD93D; transform: scale(1.15); }
  .ach-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,217,61,0.15);
    border: 1px solid rgba(255,217,61,0.4);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 10px;
    font-family: 'Press Start 2P', monospace;
    color: #FFD93D;
  }
  .ach-badge.locked {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }
  .diff-btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.6);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .diff-btn.active {
    border-color: #FFD93D;
    background: rgba(255,217,61,0.15);
    color: #FFD93D;
  }
  .scroll-y { overflow-y: auto; max-height: 60vh; }
  .scroll-y::-webkit-scrollbar { width: 4px; }
  .scroll-y::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- HUD score during play -->
    <div id="hudScore" class="hud-score hidden">0</div>
    <div id="hudCombo" class="hud-combo">COMBO x2</div>
    <div id="hudPause" class="hud-pause hidden">⏸</div>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <div class="float-in flex flex-col items-center gap-4">
        <h1 class="title-big">FLAPPY<br>BIRD+</h1>
        <div class="glass-card">
          <p class="text-white/80 text-sm mb-3">Toque na tela ou pressione<br><span class="pixel text-xs">ESPAÇO</span> para voar</p>

          <!-- Skins -->
          <div class="mb-3">
            <div class="label-small mb-2">SKIN</div>
            <div id="skinRow" class="flex items-center justify-center gap-3"></div>
          </div>

          <!-- Difficulty -->
          <div class="mb-3">
            <div class="label-small mb-2">DIFICULDADE</div>
            <div class="flex items-center justify-center gap-2">
              <button class="diff-btn active" data-diff="easy">FÁCIL</button>
              <button class="diff-btn" data-diff="normal">NORMAL</button>
              <button class="diff-btn" data-diff="hard">DIFÍCIL</button>
            </div>
          </div>

          <div class="flex items-center justify-center gap-2 mt-2">
            <span class="label-small">BEST</span>
            <span id="bestStart" class="pixel text-yellow-300 text-lg">0</span>
          </div>
        </div>
        <button id="startBtn" class="btn-flap">JOGAR</button>
        <button id="achBtn" class="btn-ghost">CONQUISTAS</button>
      </div>
    </div>

    <!-- Achievements screen -->
    <div id="achScreen" class="overlay hidden">
      <div class="float-in glass-card scroll-y" style="max-width:360px">
        <h2 class="pixel text-base text-yellow-300 mb-4">CONQUISTAS</h2>
        <div id="achList" class="flex flex-col gap-2 items-start"></div>
        <button id="achBackBtn" class="btn-ghost mt-4">VOLTAR</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="float-in flex flex-col items-center gap-5">
        <h2 class="pixel text-xl text-white">PAUSADO</h2>
        <button id="resumeBtn" class="btn-flap">CONTINUAR</button>
        <button id="quitBtn" class="btn-ghost">SAIR</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="overScreen" class="overlay hidden">
      <div class="float-in flex flex-col items-center gap-4">
        <h2 class="pixel text-xl text-red-400" style="text-shadow:2px 2px 0 rgba(0,0,0,0.3)">GAME OVER</h2>
        <div class="glass-card">
          <div id="medalSlot" class="medal medal-none mx-auto mb-3">—</div>
          <div class="flex gap-8 justify-center">
            <div>
              <div class="label-small mb-1">SCORE</div>
              <div id="finalScore" class="pixel text-2xl text-white">0</div>
            </div>
            <div>
              <div class="label-small mb-1">BEST</div>
              <div id="finalBest" class="pixel text-2xl text-yellow-300">0</div>
            </div>
          </div>
          <div id="newRecord" class="pixel text-xs text-yellow-300 mt-3 hidden blink">NEW RECORD!</div>
          <div id="achEarned" class="flex flex-wrap justify-center gap-2 mt-3"></div>
        </div>
        <button id="retryBtn" class="btn-flap">JOGAR DE NOVO</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  FLAPPY BIRD+ — Canvas 2D Engine with extra features
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

// Logical resolution (game world)
const W = 480, H = 800;
const GROUND_H = 112;

// DPI scaling
function resize() {
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (Web Audio API) ----------
let audioCtx = null;
let soundOn = true;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playTone(freq, duration, type, vol) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sndFlap()  { playTone(600, 0.08, 'square', 0.1); }
function sndScore() { playTone(880, 0.1, 'sine', 0.12); setTimeout(()=>playTone(1320, 0.1, 'sine', 0.1), 60); }
function sndHit()   { playTone(150, 0.3, 'sawtooth', 0.2); }
function sndMedal() { playTone(523, 0.12, 'sine', 0.12); setTimeout(()=>playTone(659, 0.12, 'sine', 0.12), 100); setTimeout(()=>playTone(784, 0.15, 'sine', 0.12), 200); }
function sndCombo() { playTone(1200, 0.06, 'triangle', 0.08); }

// ---------- Skins ----------
const SKINS = [
  { name: 'Classic',  body: '#FFD93D', dark: '#E8A800', belly: 'rgba(255,200,100,0.5)', beak: '#FF8C00', eye: '#1A535C' },
  { name: 'Red',     body: '#FF6B6B', dark: '#C0392B', belly: 'rgba(255,180,160,0.5)', beak: '#FF8C00', eye: '#2C3E50' },
  { name: 'Blue',    body: '#4ECDC4', dark: '#26A69A', belly: 'rgba(180,240,235,0.5)', beak: '#FF8C00', eye: '#1A535C' },
  { name: 'Purple',  body: '#A78BFA', dark: '#7C3AED', belly: 'rgba(220,210,255,0.5)', beak: '#FF8C00', eye: '#2C3E50' },
  { name: 'Ghost',   body: '#E0E0E0', dark: '#999', belly: 'rgba(255,255,255,0.3)', beak: '#FF8C00', eye: '#333' },
  { name: 'Neon',    body: '#39FF14', dark: '#0B8B00', belly: 'rgba(180,255,160,0.5)', beak: '#FF00FF', eye: '#1A0033' },
];
let skinIdx = parseInt(localStorage.getItem('flappy_skin') || '0', 10);

// ---------- Difficulty ----------
const DIFFS = {
  easy:   { gap: 200, speed: 2.2, interval: 110, grav: 0.42, flap: -7.6, progSpeed: 0.01, progGap: 0.15 },
  normal: { gap: 180, speed: 2.6, interval: 95,  grav: 0.48, flap: -8.2, progSpeed: 0.015, progGap: 0.2 },
  hard:   { gap: 155, speed: 3.0, interval: 85,  grav: 0.55, flap: -8.8, progSpeed: 0.02, progGap: 0.25 },
};
let diffKey = localStorage.getItem('flappy_diff') || 'easy';
let diff = DIFFS[diffKey];

// ---------- Achievements ----------
const ACHIEVEMENTS = [
  { id: 'first',    name: 'Primeiro Voo',   desc: 'Marque 1 ponto',           check: s => s >= 1 },
  { id: 'ten',      name: 'Aquecendo',      desc: 'Marque 10 pontos',          check: s => s >= 10 },
  { id: 'twenty',   name: 'Voador',         desc: 'Marque 20 pontos',          check: s => s >= 20 },
  { id: 'thirty',   name: 'Profissional',   desc: 'Marque 30 pontos',          check: s => s >= 30 },
  { id: 'fifty',    name: 'Lenda',          desc: 'Marque 50 pontos',          check: s => s >= 50 },
  { id: 'combo5',   name: 'Combo Master',   desc: 'Consiga combo x5',          check: (s, st) => st.maxCombo >= 5 },
  { id: 'night',    name: 'Madrugador',     desc: 'Jogue no modo noite',       check: (s, st) => st.reachedNight },
  { id: 'skin',     name: 'Estiloso',       desc: 'Troque de skin',            check: (s, st) => st.changedSkin },
];
let unlocked = JSON.parse(localStorage.getItem('flappy_ach') || '{}');

// ---------- Game State ----------
const STATE = { START: 0, PLAYING: 1, OVER: 2, PAUSED: 3 };
let state = STATE.START;
let prevState = STATE.START;

const bird = {
  x: W * 0.28,
  y: H * 0.42,
  vy: 0,
  r: 18,
  rot: 0,
  wingPhase: 0,
  trail: [],
};

let pipes = [];
let particles = [];
let clouds = [];
let stars = [];
let mountains = [];
let groundOffset = 0;
let frame = 0;
let score = 0;
let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
let flashAlpha = 0;
let shakeT = 0;
let combo = 0;
let maxCombo = 0;
let comboTimer = 0;
let isNight = false;
let nightTransition = 0; // 0 = day, 1 = night
let reachedNight = false;
let changedSkin = false;
let scorePopups = [];
let currentGap = 180;
let currentSpeed = 2.6;
let currentInterval = 95;
let pipeSpawnTimer = 0;

// Track stats for achievements
let gameStats = { maxCombo: 0, reachedNight: false, changedSkin: false };

// Init clouds
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 40 + Math.random() * 200,
    s: 0.6 + Math.random() * 0.8,
    speed: 0.2 + Math.random() * 0.3,
  });
}

// Init stars
for (let i = 0; i < 40; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * (H * 0.6),
    r: 0.5 + Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.02 + Math.random() * 0.03,
  });
}

// Init mountains (background)
for (let i = 0; i < 6; i++) {
  mountains.push({
    x: i * 100 - 50,
    h: 80 + Math.random() * 60,
    w: 120 + Math.random() * 60,
    speed: 0.3,
  });
}

// ---------- DOM refs ----------
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const pauseScreen = document.getElementById('pauseScreen');
const achScreen = document.getElementById('achScreen');
const hudScore = document.getElementById('hudScore');
const hudCombo = document.getElementById('hudCombo');
const hudPause = document.getElementById('hudPause');
const elBestStart = document.getElementById('bestStart');
const elFinalScore = document.getElementById('finalScore');
const elFinalBest = document.getElementById('finalBest');
const elNewRecord = document.getElementById('newRecord');
const elMedal = document.getElementById('medalSlot');
const elAchEarned = document.getElementById('achEarned');
const skinRow = document.getElementById('skinRow');
elBestStart.textContent = best;

// Build skin buttons
function buildSkins() {
  skinRow.innerHTML = '';
  SKINS.forEach((sk, i) => {
    const btn = document.createElement('div');
    btn.className = 'skin-btn' + (i === skinIdx ? ' active' : '');
    btn.style.background = `radial-gradient(circle at 35% 35%, ${sk.body}, ${sk.dark})`;
    btn.title = sk.name;
    btn.addEventListener('click', () => {
      skinIdx = i;
      localStorage.setItem('flappy_skin', String(i));
      if (i !== 0) { changedSkin = true; gameStats.changedSkin = true; }
      buildSkins();
    });
    skinRow.appendChild(btn);
  });
}
buildSkins();

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  if (btn.dataset.diff === diffKey) {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diffKey = btn.dataset.diff;
    diff = DIFFS[diffKey];
    localStorage.setItem('flappy_diff', diffKey);
  });
});

// ---------- Input ----------
function flap() {
  initAudio();
  if (state === STATE.START) { startGame(); return; }
  if (state === STATE.PAUSED) return;
  if (state === STATE.PLAYING) {
    bird.vy = diff.flap;
    sndFlap();
    // burst particles
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: bird.x - 10, y: bird.y + 5,
        vx: -1 - Math.random() * 2,
        vy: -1 + Math.random() * 2,
        life: 20 + Math.random() * 10,
        maxLife: 30,
        size: 2 + Math.random() * 3,
        color: 'rgba(255,255,255,0.7)',
      });
    }
  }
}

function startGame() {
  state = STATE.PLAYING;
  bird.y = H * 0.42;
  bird.vy = 0;
  bird.rot = 0;
  bird.trail = [];
  pipes = [];
  particles = [];
  scorePopups = [];
  score = 0;
  frame = 0;
  flashAlpha = 0;
  combo = 0;
  maxCombo = 0;
  comboTimer = 0;
  isNight = false;
  nightTransition = 0;
  reachedNight = false;
  currentGap = diff.gap;
  currentSpeed = diff.speed;
  currentInterval = diff.interval;
  pipeSpawnTimer = 0;
  gameStats = { maxCombo: 0, reachedNight: false, changedSkin: changedSkin };
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  achScreen.classList.add('hidden');
  hudScore.classList.remove('hidden');
  hudScore.textContent = '0';
  hudPause.classList.remove('hidden');
  hudCombo.classList.remove('show');
}

function togglePause() {
  if (state === STATE.PLAYING) {
    state = STATE.PAUSED;
    pauseScreen.classList.remove('hidden');
  } else if (state === STATE.PAUSED) {
    state = STATE.PLAYING;
    pauseScreen.classList.add('hidden');
  }
}

function gameOver() {
  state = STATE.OVER;
  flashAlpha = 0.8;
  shakeT = 12;
  sndHit();
  hudScore.classList.add('hidden');
  hudPause.classList.add('hidden');
  hudCombo.classList.remove('show');

  // explosion particles
  for (let i = 0; i < 24; i++) {
    const a = (Math.PI * 2 * i) / 24;
    particles.push({
      x: bird.x, y: bird.y,
      vx: Math.cos(a) * (2 + Math.random() * 3),
      vy: Math.sin(a) * (2 + Math.random() * 3),
      life: 30 + Math.random() * 20,
      maxLife: 50,
      size: 3 + Math.random() * 4,
      color: i % 2 ? SKINS[skinIdx].body : '#FF6B6B',
    });
  }

  const isRecord = score > best;
  if (isRecord) {
    best = score;
    localStorage.setItem('flappy_best', String(best));
  }

  // Check achievements
  gameStats.maxCombo = maxCombo;
  gameStats.reachedNight = reachedNight;
  let newAch = [];
  ACHIEVEMENTS.forEach(a => {
    if (!unlocked[a.id] && a.check(score, gameStats)) {
      unlocked[a.id] = true;
      newAch.push(a);
    }
  });
  localStorage.setItem('flappy_ach', JSON.stringify(unlocked));

  setTimeout(() => {
    elFinalScore.textContent = score;
    elFinalBest.textContent = best;
    elBestStart.textContent = best;
    elNewRecord.classList.toggle('hidden', !isRecord);

    // Medal
    let medalClass = 'medal-none', medalText = '—';
    if (score >= 40) { medalClass = 'medal-platinum'; medalText = 'PLATINUM'; sndMedal(); }
    else if (score >= 30) { medalClass = 'medal-gold'; medalText = 'GOLD'; sndMedal(); }
    else if (score >= 20) { medalClass = 'medal-silver'; medalText = 'SILVER'; sndMedal(); }
    else if (score >= 10) { medalClass = 'medal-bronze'; medalText = 'BRONZE'; sndMedal(); }
    elMedal.className = 'medal ' + medalClass + ' mx-auto mb-3';
    elMedal.textContent = medalText;

    // Show earned achievements
    elAchEarned.innerHTML = '';
    newAch.forEach(a => {
      const badge = document.createElement('div');
      badge.className = 'ach-badge';
      badge.textContent = '★ ' + a.name;
      elAchEarned.appendChild(badge);
    });

    overScreen.classList.remove('hidden');
  }, 600);
}

// Events
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); togglePause(); }
});
document.getElementById('startBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
document.getElementById('resumeBtn').addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
document.getElementById('quitBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  state = STATE.START;
  pauseScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  hudPause.classList.add('hidden');
});
document.getElementById('achBtn').addEventListener('click', (e) => { e.stopPropagation(); showAchievements(); });
document.getElementById('achBackBtn').addEventListener('click', (e) => { e.stopPropagation(); achScreen.classList.add('hidden'); startScreen.classList.remove('hidden'); });
hudPause.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });

function showAchievements() {
  const list = document.getElementById('achList');
  list.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const div = document.createElement('div');
    const isUnlocked = unlocked[a.id];
    div.className = 'ach-badge' + (isUnlocked ? '' : ' locked');
    div.style.fontSize = '9px';
    div.innerHTML = (isUnlocked ? '★ ' : '🔒 ') + a.name + ' — ' + a.desc;
    list.appendChild(div);
  });
  startScreen.classList.add('hidden');
  achScreen.classList.remove('hidden');
}

// ---------- Pipe spawning ----------
function spawnPipe() {
  const minTop = 80;
  const maxTop = H - GROUND_H - currentGap - 80;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: W + 20,
    topH: topH,
    gap: currentGap,
    passed: false,
    scored: false,
  });
}

// ---------- Collision ----------
function checkCollision() {
  if (bird.y + bird.r >= H - GROUND_H) {
    bird.y = H - GROUND_H - bird.r;
    return true;
  }
  if (bird.y - bird.r <= 0) {
    bird.y = bird.r;
    bird.vy = 0;
  }
  for (const p of pipes) {
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 72) {
      if (bird.y - bird.r < p.topH || bird.y + bird.r > p.topH + p.gap) {
        return true;
      }
      // Near-miss detection for combo (within 15px of pipe edge)
      if (!p.scored) {
        const distTop = bird.y - bird.r - p.topH;
        const distBot = p.topH + p.gap - (bird.y + bird.r);
        if (Math.abs(distTop) < 15 || Math.abs(distBot) < 15) {
          // near miss - will give combo bonus
        }
      }
    }
  }
  return false;
}

// ---------- Update ----------
function update() {
  frame++;

  // Clouds always move
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 200; }
  }

  // Stars twinkle
  for (const s of stars) {
    s.twinkle += s.speed;
  }

  // Mountains parallax
  for (const m of mountains) {
    m.x -= m.speed;
    if (m.x + m.w < 0) { m.x = W; m.h = 80 + Math.random() * 60; m.w = 120 + Math.random() * 60; }
  }

  if (state === STATE.PLAYING) {
    // Bird physics
    bird.vy += diff.grav;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy * 0.08));
    bird.wingPhase += 0.3;

    // Trail
    bird.trail.push({ x: bird.x, y: bird.y, life: 15 });
    if (bird.trail.length > 12) bird.trail.shift();
    for (const t of bird.trail) t.life--;

    // Progressive difficulty
    currentSpeed = Math.min(diff.speed + score * diff.progSpeed, diff.speed + 1.5);
    currentGap = Math.max(diff.gap - score * diff.progGap, diff.gap - 40);

    // Day/Night cycle
    if (score >= 15 && !reachedNight) {
      reachedNight = true;
    }
    if (score >= 15) {
      nightTransition = Math.min(1, nightTransition + 0.005);
      isNight = nightTransition > 0.5;
    }

    // Spawn pipes
    pipeSpawnTimer++;
    if (pipeSpawnTimer >= currentInterval) {
      spawnPipe();
      pipeSpawnTimer = 0;
    }

    // Move pipes
    for (const p of pipes) {
      p.x -= currentSpeed;
      if (!p.passed && p.x + 72 < bird.x) {
        p.passed = true;
        p.scored = true;
        score++;
        sndScore();
        hudScore.textContent = score;
        hudScore.classList.add('pop');
        setTimeout(() => hudScore.classList.remove('pop'), 150);

        // Score popup
        scorePopups.push({ x: bird.x, y: bird.y - 30, text: '+1', life: 40, vy: -1.5 });

        // Combo system
        combo++;
        comboTimer = 120;
        if (combo > maxCombo) maxCombo = combo;
        if (combo >= 2) {
          hudCombo.textContent = 'COMBO x' + combo;
          hudCombo.classList.add('show');
          sndCombo();
        }

        // score particles
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: bird.x, y: bird.y,
            vx: (Math.random() - 0.5) * 4,
            vy: -1 - Math.random() * 3,
            life: 25, maxLife: 25,
            size: 2 + Math.random() * 2,
            color: SKINS[skinIdx].body,
          });
        }
      }
    }
    pipes = pipes.filter(p => p.x + 72 > -10);

    // Combo timer
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) {
        combo = 0;
        hudCombo.classList.remove('show');
      }
    }

    // Ground scroll
    groundOffset = (groundOffset + currentSpeed) % 40;

    // Collision
    if (checkCollision()) gameOver();

  } else if (state === STATE.START) {
    // Idle bob
    bird.y = H * 0.42 + Math.sin(frame * 0.05) * 12;
    bird.rot = Math.sin(frame * 0.05) * 0.1;
    bird.wingPhase += 0.2;
    groundOffset = (groundOffset + 1.5) % 40;

  } else if (state === STATE.OVER) {
    // Bird falls
    if (bird.y + bird.r < H - GROUND_H) {
      bird.vy += diff.grav * 0.6;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 2, bird.rot + 0.05);
    }
  }

  // Particles
  for (const pt of particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.15;
    pt.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Score popups
  for (const sp of scorePopups) {
    sp.y += sp.vy;
    sp.life--;
  }
  scorePopups = scorePopups.filter(s => s.life > 0);

  // Flash decay
  if (flashAlpha > 0) flashAlpha *= 0.88;
  if (shakeT > 0) shakeT--;
}

// ---------- Drawing ----------
function drawSky() {
  // Day/night blend
  const dayColors = ['#FF6B6B', '#FFA07A', '#87CEEB', '#4ECDC4'];
  const nightColors = ['#0a0e27', '#1a1a3e', '#2d2d5e', '#3d3b7c'];
  const t = nightTransition;
  const blend = (d, n) => {
    const dr = parseInt(d.slice(1,3),16), dg = parseInt(d.slice(3,5),16), db = parseInt(d.slice(5,7),16);
    const nr = parseInt(n.slice(1,3),16), ng = parseInt(n.slice(3,5),16), nb = parseInt(n.slice(5,7),16);
    const r = Math.round(dr + (nr-dr)*t), g = Math.round(dg + (ng-dg)*t), b = Math.round(db + (nb-db)*t);
    return `rgb(${r},${g},${b})`;
  };

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, blend(dayColors[0], nightColors[0]));
  g.addColorStop(0.35, blend(dayColors[1], nightColors[1]));
  g.addColorStop(0.65, blend(dayColors[2], nightColors[2]));
  g.addColorStop(1, blend(dayColors[3], nightColors[3]));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars (visible at night)
  if (t > 0.1) {
    for (const s of stars) {
      const tw = 0.5 + Math.sin(s.twinkle) * 0.5;
      ctx.globalAlpha = t * tw;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Sun/Moon glow
  const sx = W * 0.75, sy = H * 0.22;
  if (t < 0.6) {
    const sa = 1 - t * 1.5;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120);
    sg.addColorStop(0, `rgba(255,255,200,${0.6 * sa})`);
    sg.addColorStop(1, `rgba(255,255,200,0)`);
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 120, sy - 120, 240, 240);
    ctx.fillStyle = `rgba(255,240,180,${0.8 * sa})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 36, 0, Math.PI * 2);
    ctx.fill();
  }
  if (t > 0.4) {
    const ma = (t - 0.4) / 0.6;
    const mx = W * 0.75, my = H * 0.18;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 100);
    mg.addColorStop(0, `rgba(230,230,255,${0.4 * ma})`);
    mg.addColorStop(1, `rgba(230,230,255,0)`);
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 100, my - 100, 200, 200);
    ctx.fillStyle = `rgba(240,240,255,${0.9 * ma})`;
    ctx.beginPath();
    ctx.arc(mx, my, 30, 0, Math.PI * 2);
    ctx.fill();
    // Moon craters
    ctx.fillStyle = `rgba(200,200,220,${0.5 * ma})`;
    ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 6, my + 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 10, my - 10, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawMountains() {
  const groundY = H - GROUND_H;
  const t = nightTransition;
  const dayCol = `rgba(80,100,120,0.4)`;
  const nightCol = `rgba(30,30,60,0.5)`;
  ctx.fillStyle = t < 0.5 ? dayCol : nightCol;
  for (const m of mountains) {
    ctx.beginPath();
    ctx.moveTo(m.x, groundY);
    ctx.lineTo(m.x + m.w / 2, groundY - m.h);
    ctx.lineTo(m.x + m.w, groundY);
    ctx.closePath();
    ctx.fill();
  }
}

function drawClouds() {
  const t = nightTransition;
  const alpha = 0.7 * (1 - t * 0.5);
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, -6, 28, 0, Math.PI * 2);
    ctx.arc(52, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, 12, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPipe(p) {
  const x = p.x;
  const topH = p.topH;
  const botY = p.topH + p.gap;
  const botH = H - GROUND_H - botY;
  const PW = 72;

  // Pipe body gradient
  const pg = ctx.createLinearGradient(x, 0, x + PW, 0);
  pg.addColorStop(0, '#1A9388');
  pg.addColorStop(0.3, '#2EC4B6');
  pg.addColorStop(0.5, '#3DD8CA');
  pg.addColorStop(0.7, '#2EC4B6');
  pg.addColorStop(1, '#1A9388');

  // Top pipe
  ctx.fillStyle = pg;
  ctx.fillRect(x, 0, PW, topH - 24);
  ctx.fillRect(x - 4, topH - 24, PW + 8, 24);

  // Bottom pipe
  ctx.fillRect(x, botY + 24, PW, botH - 24);
  ctx.fillRect(x - 4, botY, PW + 8, 24);

  // Highlights
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 8, 0, 6, topH - 24);
  ctx.fillRect(x + 8, botY + 24, 6, botH - 24);
  ctx.fillRect(x - 2, topH - 22, PW + 4, 4);
  ctx.fillRect(x - 2, botY + 2, PW + 4, 4);

  // Dark edges
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x + PW - 10, 0, 8, topH - 24);
  ctx.fillRect(x + PW - 10, botY + 24, 8, botH - 24);
}

function drawTrail() {
  const sk = SKINS[skinIdx];
  for (let i = 0; i < bird.trail.length; i++) {
    const t = bird.trail[i];
    const alpha = (t.life / 15) * 0.3;
    const size = (i / bird.trail.length) * bird.r * 0.8;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = sk.body;
    ctx.beginPath();
    ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBird() {
  const sk = SKINS[skinIdx];
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  const r = bird.r;

  // Body
  const bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, r + 4);
  bg.addColorStop(0, sk.body);
  bg.addColorStop(0.6, sk.body);
  bg.addColorStop(1, sk.dark);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = sk.belly;
  ctx.beginPath();
  ctx.arc(2, 6, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  const wingY = Math.sin(bird.wingPhase) * 5;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(-6, 2 + wingY, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = sk.dark;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = sk.eye;
  ctx.beginPath();
  ctx.arc(10, -6, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(11, -7, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = sk.beak;
  ctx.beginPath();
  ctx.moveTo(r - 2, -2);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#E07000';
  ctx.beginPath();
  ctx.moveTo(r - 2, 1);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  const y = H - GROUND_H;
  const t = nightTransition;
  // Ground base
  const groundCol = t < 0.5 ? '#DEB887' : '#5d4e3a';
  ctx.fillStyle = groundCol;
  ctx.fillRect(0, y, W, GROUND_H);

  // Grass strip
  const grassCol = t < 0.5 ? '#7CB342' : '#3a5a2a';
  const grassLight = t < 0.5 ? '#9CCC65' : '#4a6a3a';
  ctx.fillStyle = grassCol;
  ctx.fillRect(0, y, W, 16);
  ctx.fillStyle = grassLight;
  ctx.fillRect(0, y, W, 6);

  // Diagonal pattern
  const patternCol = t < 0.5 ? '#C19A6B' : '#4d3e2a';
  ctx.fillStyle = patternCol;
  for (let i = -1; i < W / 40 + 1; i++) {
    const gx = i * 40 - groundOffset;
    ctx.beginPath();
    ctx.moveTo(gx, y + 16);
    ctx.lineTo(gx + 20, y + 16);
    ctx.lineTo(gx + 10, y + GROUND_H);
    ctx.lineTo(gx - 10, y + GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  // Top edge shadow
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, y + 16, W, 3);
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawScorePopups() {
  for (const sp of scorePopups) {
    const alpha = sp.life / 40;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFD93D';
    ctx.font = 'bold 20px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(sp.text, sp.x, sp.y);
    ctx.globalAlpha = 1;
  }
}

function drawFlash() {
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Main loop ----------
function render() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeT * 0.8,
      (Math.random() - 0.5) * shakeT * 0.8
    );
  }

  drawSky();
  drawMountains();
  drawClouds();
  drawTrail();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();
  drawParticles();
  drawScorePopups();
  drawFlash();

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
