<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #FF6B6B;
    --sky-mid: #FFA07A;
    --sky-bot: #4ECDC4;
    --pipe: #2EC4B6;
    --pipe-dark: #1A9388;
    --bird: #FFD93D;
    --bird-dark: #E8A800;
    --ground: #DEB887;
    --ground-dark: #C19A6B;
    --ink: #1A535C;
    --glass: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a2a3a 0%, #0d1117 100%);
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 800px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    border-radius: 0;
  }
  @media (min-width: 481px) and (min-height: 801px) {
    #stage { border-radius: 20px; }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .btn-flap {
    background: linear-gradient(135deg, #FFD93D, #FFA500);
    color: #1A535C;
    border: none;
    padding: 16px 40px;
    border-radius: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 0 #C97F00, 0 8px 24px rgba(255,165,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn-flap:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #C97F00, 0 4px 12px rgba(255,165,0,0.3);
  }
  .score-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 56px;
    color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    line-height: 1;
  }
  .label-small {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .title-big {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    color: #FFD93D;
    text-shadow: 3px 3px 0 #C97F00, 0 0 40px rgba(255,217,61,0.3);
    line-height: 1.4;
  }
  .medal {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .medal-gold { background: linear-gradient(135deg, #FFD700, #B8860B); }
  .medal-silver { background: linear-gradient(135deg, #C0C0C0, #808080); }
  .medal-bronze { background: linear-gradient(135deg, #CD7F32, #8B4513); }
  .medal-none { background: linear-gradient(135deg, #555, #333); }
  .blink { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .float-in { animation: floatIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes floatIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .hud-score {
    position: absolute;
    top: 40px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 48px;
    color: #fff;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    z-index: 5;
    pointer-events: none;
    transition: transform 0.15s;
  }
  .hud-score.pop { transform: translateX(-50%) scale(1.3); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- HUD score during play -->
    <div id="hudScore" class="hud-score hidden">0</div>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <div class="float-in flex flex-col items-center gap-6">
        <h1 class="title-big">FLAPPY<br>BIRD</h1>
        <div class="glass-card">
          <p class="text-white/80 text-sm mb-3">Toque na tela ou pressione<br><span class="pixel text-xs">ESPAÇO</span> para voar</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <span class="label-small">BEST</span>
            <span id="bestStart" class="pixel text-yellow-300 text-lg">0</span>
          </div>
        </div>
        <button id="startBtn" class="btn-flap">JOGAR</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="overScreen" class="overlay hidden">
      <div class="float-in flex flex-col items-center gap-5">
        <h2 class="pixel text-xl text-red-400" style="text-shadow:2px 2px 0 rgba(0,0,0,0.3)">GAME OVER</h2>
        <div class="glass-card">
          <div id="medalSlot" class="medal medal-none mx-auto mb-4">—</div>
          <div class="flex gap-8 justify-center">
            <div>
              <div class="label-small mb-1">SCORE</div>
              <div id="finalScore" class="pixel text-2xl text-white">0</div>
            </div>
            <div>
              <div class="label-small mb-1">BEST</div>
              <div id="finalBest" class="pixel text-2xl text-yellow-300">0</div>
            </div>
          </div>
          <div id="newRecord" class="pixel text-xs text-yellow-300 mt-4 hidden blink">NEW RECORD!</div>
        </div>
        <button id="retryBtn" class="btn-flap">JOGAR DE NOVO</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  FLAPPY BIRD — Canvas 2D Engine
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

// Logical resolution (game world)
const W = 480, H = 800;
const GROUND_H = 112;

// DPI scaling
function resize() {
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Game State ----------
const STATE = { START: 0, PLAYING: 1, OVER: 2 };
let state = STATE.START;

const bird = {
  x: W * 0.28,
  y: H * 0.42,
  vy: 0,
  r: 18,
  rot: 0,
  wingPhase: 0,
};

const GRAVITY = 0.48;
const FLAP_V = -8.2;
const PIPE_W = 72;
const PIPE_GAP = 180;
const PIPE_SPEED = 2.6;
const PIPE_INTERVAL = 95; // frames

let pipes = [];
let particles = [];
let clouds = [];
let groundOffset = 0;
let frame = 0;
let score = 0;
let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
let flashAlpha = 0;
let shakeT = 0;

// Init clouds
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 40 + Math.random() * 200,
    s: 0.6 + Math.random() * 0.8,
    speed: 0.2 + Math.random() * 0.3,
  });
}

// ---------- DOM refs ----------
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const hudScore = document.getElementById('hudScore');
const elBestStart = document.getElementById('bestStart');
const elFinalScore = document.getElementById('finalScore');
const elFinalBest = document.getElementById('finalBest');
const elNewRecord = document.getElementById('newRecord');
const elMedal = document.getElementById('medalSlot');
elBestStart.textContent = best;

// ---------- Input ----------
function flap() {
  if (state === STATE.START) { startGame(); return; }
  if (state === STATE.PLAYING) {
    bird.vy = FLAP_V;
    // burst particles
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: bird.x - 10, y: bird.y + 5,
        vx: -1 - Math.random() * 2,
        vy: -1 + Math.random() * 2,
        life: 20 + Math.random() * 10,
        maxLife: 30,
        size: 2 + Math.random() * 3,
        color: 'rgba(255,255,255,0.7)',
      });
    }
  }
}

function startGame() {
  state = STATE.PLAYING;
  bird.y = H * 0.42;
  bird.vy = 0;
  bird.rot = 0;
  pipes = [];
  particles = [];
  score = 0;
  frame = 0;
  flashAlpha = 0;
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  hudScore.classList.remove('hidden');
  hudScore.textContent = '0';
}

function gameOver() {
  state = STATE.OVER;
  flashAlpha = 0.8;
  shakeT = 12;
  hudScore.classList.add('hidden');

  // explosion particles
  for (let i = 0; i < 24; i++) {
    const a = (Math.PI * 2 * i) / 24;
    particles.push({
      x: bird.x, y: bird.y,
      vx: Math.cos(a) * (2 + Math.random() * 3),
      vy: Math.sin(a) * (2 + Math.random() * 3),
      life: 30 + Math.random() * 20,
      maxLife: 50,
      size: 3 + Math.random() * 4,
      color: i % 2 ? '#FFD93D' : '#FF6B6B',
    });
  }

  const isRecord = score > best;
  if (isRecord) {
    best = score;
    localStorage.setItem('flappy_best', String(best));
  }

  setTimeout(() => {
    elFinalScore.textContent = score;
    elFinalBest.textContent = best;
    elBestStart.textContent = best;
    elNewRecord.classList.toggle('hidden', !isRecord);

    // Medal
    let medalClass = 'medal-none', medalText = '—';
    if (score >= 30) { medalClass = 'medal-gold'; medalText = 'GOLD'; }
    else if (score >= 20) { medalClass = 'medal-silver'; medalText = 'SILVER'; }
    else if (score >= 10) { medalClass = 'medal-bronze'; medalText = 'BRONZE'; }
    elMedal.className = 'medal ' + medalClass + ' mx-auto mb-4';
    elMedal.textContent = medalText;

    overScreen.classList.remove('hidden');
  }, 600);
}

// Events
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
document.getElementById('startBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

// ---------- Pipe spawning ----------
function spawnPipe() {
  const minTop = 80;
  const maxTop = H - GROUND_H - PIPE_GAP - 80;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: W + 20,
    topH: topH,
    gap: PIPE_GAP,
    passed: false,
  });
}

// ---------- Collision ----------
function checkCollision() {
  // Ground
  if (bird.y + bird.r >= H - GROUND_H) {
    bird.y = H - GROUND_H - bird.r;
    return true;
  }
  // Ceiling
  if (bird.y - bird.r <= 0) {
    bird.y = bird.r;
    bird.vy = 0;
  }
  // Pipes
  for (const p of pipes) {
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.topH || bird.y + bird.r > p.topH + p.gap) {
        return true;
      }
    }
  }
  return false;
}

// ---------- Update ----------
function update() {
  frame++;

  // Clouds always move
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 200; }
  }

  if (state === STATE.PLAYING) {
    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy * 0.08));
    bird.wingPhase += 0.3;

    // Spawn pipes
    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    // Move pipes
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        hudScore.textContent = score;
        hudScore.classList.add('pop');
        setTimeout(() => hudScore.classList.remove('pop'), 150);
        // score particles
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: bird.x, y: bird.y,
            vx: (Math.random() - 0.5) * 4,
            vy: -1 - Math.random() * 3,
            life: 25, maxLife: 25,
            size: 2 + Math.random() * 2,
            color: '#FFD93D',
          });
        }
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -10);

    // Ground scroll
    groundOffset = (groundOffset + PIPE_SPEED) % 40;

    // Collision
    if (checkCollision()) gameOver();

  } else if (state === STATE.START) {
    // Idle bob
    bird.y = H * 0.42 + Math.sin(frame * 0.05) * 12;
    bird.rot = Math.sin(frame * 0.05) * 0.1;
    bird.wingPhase += 0.2;
    groundOffset = (groundOffset + 1.5) % 40;

  } else if (state === STATE.OVER) {
    // Bird falls
    if (bird.y + bird.r < H - GROUND_H) {
      bird.vy += GRAVITY * 0.6;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 2, bird.rot + 0.05);
    }
  }

  // Particles
  for (const pt of particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.15;
    pt.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Flash decay
  if (flashAlpha > 0) flashAlpha *= 0.88;
  if (shakeT > 0) shakeT--;
}

// ---------- Drawing ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FF6B6B');
  g.addColorStop(0.35, '#FFA07A');
  g.addColorStop(0.65, '#87CEEB');
  g.addColorStop(1, '#4ECDC4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Sun glow
  const sx = W * 0.75, sy = H * 0.22;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120);
  sg.addColorStop(0, 'rgba(255,255,200,0.6)');
  sg.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - 120, sy - 120, 240, 240);
  ctx.fillStyle = 'rgba(255,240,180,0.8)';
  ctx.beginPath();
  ctx.arc(sx, sy, 36, 0, Math.PI * 2);
  ctx.fill();
}

function drawClouds() {
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, -6, 28, 0, Math.PI * 2);
    ctx.arc(52, 0, 22, 0, Math.PI * 2);
    ctx.arc(24, 12, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPipe(p) {
  const x = p.x;
  const topH = p.topH;
  const botY = p.topH + p.gap;
  const botH = H - GROUND_H - botY;

  // Pipe body gradient
  const pg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  pg.addColorStop(0, '#1A9388');
  pg.addColorStop(0.3, '#2EC4B6');
  pg.addColorStop(0.5, '#3DD8CA');
  pg.addColorStop(0.7, '#2EC4B6');
  pg.addColorStop(1, '#1A9388');

  // Top pipe
  ctx.fillStyle = pg;
  ctx.fillRect(x, 0, PIPE_W, topH - 24);
  // Top cap
  ctx.fillRect(x - 4, topH - 24, PIPE_W + 8, 24);

  // Bottom pipe
  ctx.fillRect(x, botY + 24, PIPE_W, botH - 24);
  // Bottom cap
  ctx.fillRect(x - 4, botY, PIPE_W + 8, 24);

  // Highlights
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 8, 0, 6, topH - 24);
  ctx.fillRect(x + 8, botY + 24, 6, botH - 24);
  ctx.fillRect(x - 2, topH - 22, PIPE_W + 4, 4);
  ctx.fillRect(x - 2, botY + 2, PIPE_W + 4, 4);

  // Dark edges
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x + PIPE_W - 10, 0, 8, topH - 24);
  ctx.fillRect(x + PIPE_W - 10, botY + 24, 8, botH - 24);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  const r = bird.r;

  // Body
  const bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, r + 4);
  bg.addColorStop(0, '#FFE873');
  bg.addColorStop(0.6, '#FFD93D');
  bg.addColorStop(1, '#E8A800');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = 'rgba(255,200,100,0.5)';
  ctx.beginPath();
  ctx.arc(2, 6, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  const wingY = Math.sin(bird.wingPhase) * 5;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(-6, 2 + wingY, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#E8A800';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1A535C';
  ctx.beginPath();
  ctx.arc(10, -6, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(11, -7, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#FF8C00';
  ctx.beginPath();
  ctx.moveTo(r - 2, -2);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#E07000';
  ctx.beginPath();
  ctx.moveTo(r - 2, 1);
  ctx.lineTo(r + 10, 0);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  const y = H - GROUND_H;
  // Ground base
  ctx.fillStyle = '#DEB887';
  ctx.fillRect(0, y, W, GROUND_H);

  // Grass strip
  ctx.fillStyle = '#7CB342';
  ctx.fillRect(0, y, W, 16);
  ctx.fillStyle = '#9CCC65';
  ctx.fillRect(0, y, W, 6);

  // Diagonal pattern
  ctx.fillStyle = '#C19A6B';
  for (let i = -1; i < W / 40 + 1; i++) {
    const gx = i * 40 - groundOffset;
    ctx.beginPath();
    ctx.moveTo(gx, y + 16);
    ctx.lineTo(gx + 20, y + 16);
    ctx.lineTo(gx + 10, y + GROUND_H);
    ctx.lineTo(gx - 10, y + GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  // Top edge shadow
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, y + 16, W, 3);
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFlash() {
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Main loop ----------
function render() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeT * 0.8,
      (Math.random() - 0.5) * shakeT * 0.8
    );
  }

  drawSky();
  drawClouds();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();
  drawParticles();
  drawFlash();

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
